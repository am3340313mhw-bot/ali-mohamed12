<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>

    <h1>نظام إدارة وتحليل نتائج الطلاب</h1>
    <p>افتح Console لعرض تقارير الطلاب والنتائج.</p>

    <script>

        // =====================================
        // 1. إنشاء Class باسم Student
        // =====================================

        class Student {

            constructor(id, name, grades, attendance) {

                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;

            }

            // =====================================
            // 2. حساب متوسط الدرجات باستخدام reduce
            // =====================================

            calculateAverage() {

                let total = this.grades.reduce((sum, grade) => {
                    return sum + grade;
                }, 0);

                return total / this.grades.length;

            }

            // =====================================
            // 3. تحديد التقدير باستخدام if / else
            // =====================================

            getGrade() {

                let average = this.calculateAverage();

                if (average >= 90) {
                    return "A";
                }

                else if (average >= 80) {
                    return "B";
                }

                else if (average >= 70) {
                    return "C";
                }

                else if (average >= 60) {
                    return "D";
                }

                else if (average >= 50) {
                    return "E";
                }

                else {
                    return "F";
                }

            }

            // =====================================
            // 4. تحديد النتيجة النهائية
            // =====================================

            getResult() {

                let average = this.calculateAverage();

                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                }

                else {
                    return "يحتاج مراجعة";
                }

            }

        }


        // =====================================
        // 5. إنشاء مصفوفة الطلاب الرئيسية
        // =====================================

        let studentsList = [

            new Student(1, "Ahmed", [95, 90, 92], 95),

            new Student(2, "Mona", [80, 75, 85], 85),

            new Student(3, "Zahraa", [45, 48, 42], 90),

            new Student(4, "Ali", [50, 45, 46], 70)

        ];


        // =====================================
        // 6. استخراج الطلاب المتعثرين باستخدام filter
        // =====================================

        let strugglingStudents = studentsList.filter(student => {

            let average = student.calculateAverage();

            return average >= 40 && average <= 49;

        });


        // =====================================
        // 7. إضافة 5 درجات رأفة باستخدام map
        // =====================================

        let graceStudents = strugglingStudents.map(student => {

            let oldAverage = student.calculateAverage();

            let newAverage = Math.min(oldAverage + 5, 100);

            return {

                id: student.id,

                name: student.name,

                oldAverage: oldAverage,

                newAverage: newAverage

            };

        });


        // =====================================
        // 8. جمع المتوسطات الجديدة باستخدام reduce
        // =====================================

        let totalNewAverages = graceStudents.reduce((sum, student) => {

            return sum + student.newAverage;

        }, 0);


        // =====================================
        // 9. حساب متوسط الرأفة مع منع القسمة على صفر
        // =====================================

        let graceAverage = 0;

        if (graceStudents.length > 0) {

            graceAverage = totalNewAverages / graceStudents.length;

        }

        else {

            graceAverage = 0;

        }


        // =====================================
        // 10. طباعة تقرير جميع الطلاب
        // =====================================

        console.log("========== Students Reports ==========");

        studentsList.forEach(student => {

            console.log("------------------------------");

            console.log("Student ID:", student.id);

            console.log("Student Name:", student.name);

            console.log("Average:", student.calculateAverage());

            console.log("Grade:", student.getGrade());

            console.log("Result:", student.getResult());

        });


        // =====================================
        // 11. طباعة الطلاب الذين حصلوا على الرأفة
        // =====================================

        console.log("========== Grace Students ==========");

        console.table(graceStudents);


        // =====================================
        // 12. طباعة متوسط درجات الرأفة
        // =====================================

        console.log("========== Grace Average ==========");

        console.log("Average After Grace:", graceAverage);


        // =====================================
        // نهاية البرنامج
        // =====================================

        console.log("========== Program Finished ==========");

    </script>

</body>
</html>
